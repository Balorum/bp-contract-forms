<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-9UbHiBcI7MXi12D5+Q8e2QRqZXJ1zFRVme7VCuLT2A8='; style-src 'sha256-H3vvRJ3j15C7jP0+A+aIYbTvV58nzcy1cqktDPixhFA='; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contract end date</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1d2329; --muted:#5f6b76; --accent:#1264a3; --border:#d8dde3; --danger:#b42318; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16191d; --card:#22262b; --text:#e8eaed; --muted:#a3acb6; --accent:#4ea1e6; --border:#3a4047; --danger:#f97066; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
  main { max-width:480px; margin:48px auto; padding:0 16px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:24px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .muted { color:var(--muted); font-size:14px; }
  label { display:block; font-weight:600; margin:20px 0 6px; }
  input[type=date] { width:100%; padding:10px 12px; font-size:16px; border:1px solid var(--border); border-radius:8px; background:var(--card); color:var(--text); }
  button { margin-top:20px; width:100%; padding:12px; font-size:16px; font-weight:600; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .confirm { margin-top:16px; padding:12px; border-radius:8px; background:var(--bg); border:1px solid var(--border); display:none; }
  .error { color:var(--danger); font-size:14px; margin-top:8px; min-height:20px; }
  dl { margin:16px 0 0; display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:14px; }
  dt { color:var(--muted); } dd { margin:0; overflow-wrap:anywhere; }
</style>
</head>
<body>
<main>
  <div class="card" id="card">
    <h1>Contract end date</h1>
    <div class="muted">The date is used to send renewal reminders 90 and 30 days before the contract ends.</div>
    <dl>
      <dt>Project</dt><dd id="project">-</dd>
      <dt>Document</dt><dd id="doc">-</dd>
      <dt>AI found</dt><dd id="found">-</dd>
    </dl>
    <form id="f" novalidate>
      <label for="d">End date</label>
      <input type="date" id="d" required min="2020-01-01" max="2040-12-31">
      <div class="error" id="err"></div>
      <div class="confirm" id="confirm"></div>
      <button type="submit" id="btn">Continue</button>
    </form>
  </div>
</main>
<script>
(function () {
  var raw = location.hash.replace(/^#\??/, '') || location.search.replace(/^\?/, '');
  var p = new URLSearchParams(raw);
  if (location.hash) history.replaceState(null, '', location.pathname);
  var hook = p.get('hook') || '', r = p.get('r') || '', s = p.get('s') || '';
  var $ = function (id) { return document.getElementById(id); };
  $('project').textContent = p.get('p') || '-';
  $('doc').textContent = p.get('doc') || '-';
  $('found').textContent = p.get('cur') || 'no end date found';
  if (p.get('cur')) $('d').value = p.get('cur');
  var ok = /^https:\/\/app\.cogniagent\.ai\/api\/webhooks\//.test(hook) && /^\d+$/.test(r) && s.length >= 16;
  if (!ok) { $('err').textContent = 'This link is incomplete. Please use the button in the Slack message.'; $('btn').disabled = true; }
  var step = 1;
  $('d').addEventListener('input', function () { step = 1; $('confirm').style.display = 'none'; $('btn').textContent = 'Continue'; $('err').textContent = ''; });
  $('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = $('d').value;
    if (!v || v < '2020-01-01' || v > '2040-12-31') { $('err').textContent = 'Please choose a valid date.'; return; }
    if (step === 1) {
      var nice = new Date(v + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
      $('confirm').textContent = 'The contract for ' + ($('project').textContent) + ' ends on ' + nice + ' (' + v + '). Click Save to record it.';
      $('confirm').style.display = 'block'; $('btn').textContent = 'Save ' + v; step = 2; return;
    }
    $('btn').disabled = true; $('btn').textContent = 'Saving...';
    var q = new URLSearchParams({ k: 'rv', r: r, a: 'date', d: v, s: s });
    location.href = hook + (hook.indexOf('?') < 0 ? '?' : '&') + q.toString();
  });
})();
</script>
</body>
</html>
